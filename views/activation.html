{{ template "layout/base.html" . }}

{{define "head"}}
<title>UI Activation</title>
{{end}}

{{define "body"}}
<div class="card card-default">
  <div class="card-header with-border">
    <h3 class="card-title">OpenVPN UI Activation</h3>
    <div class="pull-right card-tools">
      <button type="button" class="btn btn-tool" data-card-widget="collapse">
        <i class="fa fa-minus"></i></button>
    </div>
  </div>
  <!-- /.card-header -->
  <!-- form start -->
  <div class="card-body">
    {{template "common/alert.html" .}}
    <form role="form" action="{{urlfor "ActivationController.Post"}}" method="post">
    <div class="card-body">

        <div class="form-group">
            <label>Status VPN:</label>
            <span id="vpnStatus" class="badge badge-secondary">Loading...</span>
        </div>

        <div class="form-group">
            <label for="logs">Logs</label>
            <pre id="logBox" style="height:300px; overflow-y:auto; background:#000; color:#0f0; padding:10px; border-radius:5px;">
                Loading logs...
            </pre>
        </div>

        <div class="form-group">
            <label for="vpnHost">VPN Host</label>
            <select class="form-control" id="vpnHost" name="vpn_host"></select>
        </div>


        <div class="form-group">
          <label for="vpnPort">VPN Port</label>
          <input type="number" class="form-control" id="vpnPort" name="vpn_port" placeholder="Input Port" min="1" max="65535">
      </div>

      <div class="form-group">
        <label class="col-form-label" for="name">Cookie</label>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fa fa-exchange"></i></span>
          </div>
          <input type="text" class="form-control" name="cookie" id="cookie" placeholder="Enter cookie">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 125px;">Activate</button>
    </div>
    <!-- /.card-body -->
    </form>
  </div>
</div>
<!-- /.card -->
{{end}}
<script>
    function loadStatus() {
        fetch("/status")
            .then(resp => resp.json())
            .then(data => {
                // status
                const statusBadge = document.getElementById("vpnStatus");
                statusBadge.className = "badge " + (data.active ? "badge-success" : "badge-danger");
                statusBadge.textContent = data.active ? "Active ("+data.server+")" : "Not Active ("+data.server+")";

                // logs
                const logBox = document.getElementById("logBox");
                logBox.textContent = data.logs;
                logBox.scrollTop = logBox.scrollHeight; // auto scroll

                // servers dropdown
                const select = document.getElementById("vpnHost");
                select.innerHTML = ""; // clear
                data.servers.forEach((s, i) => {
                    let opt = document.createElement("option");
                    opt.value = s;
                    opt.textContent = s;
                    if (i === 0) opt.selected = true;
                    select.appendChild(opt);
                });
            })
            .catch(err => {
                document.getElementById("vpnStatus").textContent = "Error loading status";
                console.error(err);
            });
    }

    document.addEventListener("DOMContentLoaded", loadStatus);

    setInterval(loadStatus, 10000);
</script>
